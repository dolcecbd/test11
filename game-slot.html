<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quyết Chiến Tiền Thưởng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050505; /* Nền đen tuyền giống ảnh 2 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    
    /* KHUNG MÁY SLOT MIỀN TÂY */
    .slot-machine {
      background: linear-gradient(180deg, #4e342e 0%, #3e2723 100%);
      padding: 24px 20px;
      border-radius: 16px;
      border: 4px solid #ffb300; /* Viền vàng kim */
      box-shadow: 0 10px 30px rgba(255, 179, 0, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
      width: 92%;
      max-width: 380px;
      text-align: center;
      position: relative;
    }
    .machine-header {
      background: #271300;
      border: 2px solid #ffb300;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 20px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .machine-title {
      font-size: 20px;
      font-weight: 900;
      color: #ffca28;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px #000;
      letter-spacing: 1px;
    }
    .machine-subtitle {
      font-size: 11px;
      color: #ff8f00;
      font-weight: 700;
      margin-top: 2px;
    }

    /* KHU VỰC QUAY (REELS) */
    .reels-container {
      display: flex;
      justify-content: space-around;
      background: #1a1a1a;
      padding: 15px 12px;
      border-radius: 10px;
      border: inset 6px #795548;
      margin-bottom: 20px;
      position: relative;
    }
    .reels-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 15px 20px rgba(0,0,0,0.6), inset 0 -15px 20px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 5;
    }
    .reel {
      width: 30%;
      aspect-ratio: 1/1.2;
      background: #e0e0e0;
      border-radius: 6px;
      border: 2px solid #9e9e9e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      overflow: hidden;
      position: relative;
    }
    .reel-inner {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      transition: top 0.05s linear;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    /* BẢNG ĐIỀU KHIỂN */
    .control-panel {
      background: rgba(0, 0, 0, 0.4);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #5d4037;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 800;
    }
    .balance-box, .bet-box {
      background: #000;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #795548;
      color: #4caf50; /* Xanh lá tiền */
      font-size: 15px;
      min-width: 100px;
      text-align: center;
    }
    .bet-box { 
      color: #ff9800; /* Cam tiền cược */
    }
    
    .spin-btn {
      width: 100%;
      background: linear-gradient(180deg, #ffca28 0%, #ff8f00 100%);
      color: #3e2723;
      font-size: 22px;
      font-weight: 900;
      border: 3px solid #fff3e0;
      border-radius: 50px;
      padding: 14px 0;
      cursor: pointer;
      box-shadow: 0 6px 0 #c77800, 0 10px 15px rgba(0,0,0,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.1s;
    }
    .spin-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #c77800, 0 4px 5px rgba(0,0,0,0.5);
    }
    .spin-btn:disabled {
      background: #757575;
      border-color: #9e9e9e;
      color: #bdbdbd;
      box-shadow: 0 6px 0 #424242;
      cursor: not-allowed;
    }
    
    .msg-board {
      margin-top: 16px;
      font-size: 14px;
      font-weight: bold;
      height: 20px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }
    
    /* HIỆU ỨNG TRÚNG THƯỞNG */
    .win-anim {
      color: #ffeb3b;
      font-size: 16px;
      animation: blinkWin 0.4s infinite alternate;
    }
    @keyframes blinkWin {
      from { text-shadow: 0 0 10px #ffeb3b, 0 0 20px #ff9800; transform: scale(1); }
      to { text-shadow: 0 0 20px #ffeb3b, 0 0 30px #ff9800; transform: scale(1.05); }
    }
    .jackpot-anim {
      color: #ff1744;
      font-size: 18px;
      font-weight: 900;
      animation: blinkJackpot 0.2s infinite alternate;
    }
    @keyframes blinkJackpot {
      from { text-shadow: 0 0 10px #ff1744, 0 0 20px #ffeb3b; }
      to { text-shadow: 0 0 20px #fff, 0 0 40px #ffeb3b; }
    }
  </style>
</head>
<body>

  <div class="slot-machine">
    <div class="machine-header">
      <div class="machine-title">Quyết Chiến</div>
      <div class="machine-subtitle">TIỀN THƯỞNG KHỦNG</div>
    </div>
    
    <div class="reels-container">
      <div class="reel"><div class="reel-inner" id="reel1">🤠</div></div>
      <div class="reel"><div class="reel-inner" id="reel2">🔫</div></div>
      <div class="reel"><div class="reel-inner" id="reel3">💰</div></div>
    </div>

    <div class="control-panel">
      <div class="info-row">
        <div>SỐ DƯ <br><div class="balance-box" id="balance">500,000</div></div>
        <div>CƯỢC <br><div class="bet-box" id="bet">10,000</div></div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spin()">QUAY ĐI</button>
      <div class="msg-board" id="msg">Sẵn sàng đi săn tiền thưởng!</div>
    </div>
  </div>

  <script>
    // BỘ ICON CHUẨN MIỀN TÂY (WILD WEST)
    const symbols = ['🤠', '💰', '🌟', '🔫', '🐴', '💣'];
    
    // BẢNG TỈ LỆ TRẢ THƯỞNG (RTP HỆ SỐ)
    const payouts = {
      '💣': 2,    // Bom: x2 cược
      '🐴': 5,    // Ngựa: x5 cược
      '🔫': 10,   // Súng: x10 cược
      '🤠': 20,   // Cao bồi: x20 cược
      '💰': 50,   // Túi tiền: x50 cược
      '🌟': 100   // Huy hiệu cảnh trưởng: JACKPOT x100 cược
    };

    let balance = 500000; // Số dư ban đầu
    const bet = 10000;    // Tiền cược mỗi lần quay
    let isSpinning = false;

    // Hàm format tiền (VD: 500,000)
    const fm = (num) => num.toLocaleString('en-US');
    
    // Hàm lấy ngẫu nhiên 1 icon
    const getRandomSymbol = () => symbols[Math.floor(Math.random() * symbols.length)];

    // Cập nhật hiển thị số dư
    function updateUI() {
      document.getElementById('balance').innerText = fm(balance);
    }

    // Xử lý logic khi bấm nút QUAY
    function spin() {
      if (isSpinning) return;
      
      if (balance < bet) {
        document.getElementById('msg').innerHTML = '<span style="color:#ff1744">Hết tiền! Hãy nạp thêm điểm.</span>';
        return;
      }

      isSpinning = true;
      balance -= bet; // Trừ tiền cược
      updateUI();
      
      const btn = document.getElementById('spinBtn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      msg.innerText = 'Đang quay vòng quay...';

      const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
      
      // Tạo hiệu ứng nháy icon liên tục
      let spinInterval = setInterval(() => {
        reels.forEach(r => r.innerText = getRandomSymbol());
      }, 60);

      // KẾT QUẢ QUAY (Thuật toán Backend sẽ nằm ở đây)
      const r1 = getRandomSymbol();
      const r2 = getRandomSymbol();
      const r3 = getRandomSymbol(); 
      // Mẹo: Nếu bạn muốn ép ra trúng thưởng để test, thử sửa thành: 
      // const r1 = '💰'; const r2 = '💰'; const r3 = '💰';

      // Dừng vòng quay sau 1.5 giây
      setTimeout(() => {
        clearInterval(spinInterval);
        reels[0].innerText = r1;
        reels[1].innerText = r2;
        reels[2].innerText = r3;

        checkWin(r1, r2, r3);
        
        isSpinning = false;
        btn.disabled = false;
      }, 1500);
    }

    // Kiểm tra kết quả và cộng tiền
    function checkWin(r1, r2, r3) {
      const msg = document.getElementById('msg');
      
      if (r1 === r2 && r2 === r3) {
        // TRÚNG 3 Ô LIÊN TIẾP (NỔ HŨ)
        const multiplier = payouts[r1];
        const winAmount = bet * multiplier;
        balance += winAmount;
        
        if (r1 === '🌟') {
          msg.innerHTML = `<span class="jackpot-anim">💎 SUPER JACKPOT: +${fm(winAmount)} 💎</span>`;
        } else {
          msg.innerHTML = `<span class="win-anim">🎉 BIG WIN: +${fm(winAmount)} 🎉</span>`;
        }
      } else if (r1 === r2 || r2 === r3 || r1 === r3) {
        // TRÚNG 2 Ô (HOÀ VỐN)
        balance += bet;
        msg.innerHTML = `<span style="color:#69f0ae">Hòa vốn! Chúc may mắn lần sau.</span>`;
      } else {
        // TRƯỢT
        msg.innerText = 'Trượt rồi! Đi săn tiếp nào.';
      }
      
      updateUI();
    }
  </script>
</body>
</html>
