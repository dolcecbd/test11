<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quyết Chiến Tiền Thưởng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #2b1b11;
      background-image: radial-gradient(circle at center, #4a2e1b 0%, #1a0f08 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      font-family: "Times New Roman", Times, serif;
      color: #ffffff;
      overflow: hidden;
      padding-top: 10px;
    }
    
    /* KHUNG GAME CHÍNH */
    .game-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* THANH HỆ SỐ NHÂN (X1, X2, X4...) */
    .multiplier-bar {
      width: 100%;
      background: url('data:image/svg+xml;utf8,<svg width="100" height="40" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="40" fill="%234a2e1b"/><path d="M0 20 Q 50 0 100 20 L 100 40 L 0 40 Z" fill="%23382112"/></svg>') center/cover;
      border-top: 2px solid #a67c52;
      border-bottom: 2px solid #a67c52;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 5px;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .mult-item {
      color: #8c6b4a;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 1px 1px 2px #000;
      transition: all 0.3s ease;
    }
    .mult-item.active {
      color: #ffda75;
      font-size: 32px;
      text-shadow: 0 0 10px #ffb300, 0 0 20px #ffb300;
      transform: scale(1.1);
    }
    .ribbon-text {
      position: absolute;
      top: -10px;
      font-size: 10px;
      color: #8c6b4a;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .ribbon-left { left: 10px; }
    .ribbon-right { right: 10px; }

    /* LƯỚI QUAY (6x4) */
    .reels-board {
      flex: 1;
      width: 100%;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      perspective: 1000px;
    }
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 8px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }
    .reel-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      height: 280px; 
      position: relative;
    }
    .symbol-cell {
      flex: 1;
      background: linear-gradient(135deg, #3d2416 0%, #1f1109 100%);
      border: 1px solid #5c3a21;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-family: Arial, sans-serif;
      font-weight: 900;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      position: absolute;
      width: 100%;
      height: 25%; 
      transition: top 0.1s linear;
    }
    
    .sym-A, .sym-K, .sym-Q, .sym-J { color: #f5d76e; }
    .sym-A { color: #ff5252; }
    .sym-Q { color: #69f0ae; }

    /* BẢNG THÔNG BÁO VÀNG */
    .notice-board {
      width: 90%;
      margin: 10px auto;
      background: linear-gradient(180deg, #d4a35e 0%, #8b5a2b 100%);
      border: 2px solid #ffda75;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      color: #3e210a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
    }

    /* THANH ĐIỀU KHIỂN DƯỚI CÙNG */
    .bottom-controls {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 20px 25px 20px;
      border-top: 2px solid #5c3a21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .info-block {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-icon {
      width: 20px; height: 20px;
      border: 1px solid #8c6b4a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #8c6b4a;
      font-family: Arial;
    }
    .info-val {
      color: #ffda75;
      font-family: Arial, sans-serif;
      font-size: 14px; /* Giảm cỡ chữ chút để chứa số lớn */
      font-weight: 700;
    }

    /* NÚT QUAY LỚN (SPIN) */
    .spin-center {
      position: relative;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffda75 0%, #a67c52 100%);
      border: 3px solid #3e210a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 218, 117, 0.4), inset 0 0 10px rgba(255,255,255,0.5);
      transition: transform 0.1s;
    }
    .spin-center:active {
      transform: scale(0.92);
    }
    .spin-inner {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, #5c3a21 0%, #1f1109 100%);
      border: 2px solid #ffda75;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spin-arrow {
      font-size: 24px;
      color: #ffda75;
      font-weight: bold;
      transform: rotate(45deg);
    }

    /* HIỆU ỨNG THẮNG */
    .win-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }
    .win-title {
      font-size: 30px;
      color: #ffda75;
      text-shadow: 0 0 20px #ff9800;
      animation: pop 0.5s ease-out forwards;
    }
    .win-amount {
      font-size: 35px; /* Chỉnh lại để số lớn ko bị tràn màn hình */
      color: #fff;
      font-family: Arial, sans-serif;
      font-weight: 900;
      text-shadow: 0 0 30px #ff1744, 0 0 10px #ff9800;
      margin-top: 10px;
      animation: pop 0.5s ease-out 0.2s forwards;
      opacity: 0;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- THANH HỆ SỐ NHÂN -->
    <div class="multiplier-bar">
      <div class="ribbon-text ribbon-left">3600 Đường</div>
      <div class="mult-item active" id="mx1">X1</div>
      <div class="mult-item" id="mx2">X2</div>
      <div class="mult-item" id="mx4">X4</div>
      <div class="mult-item" id="mx8">X8</div>
      <div class="ribbon-text ribbon-right">3600 Đường</div>
    </div>

    <!-- KHUNG LƯỚI QUAY (6 cột) -->
    <div class="reels-board">
      <div class="reels-grid" id="slotGrid">
        <!-- JS sẽ sinh ra 6 cột, mỗi cột 4 hàng ở đây -->
      </div>
    </div>

    <!-- BẢNG THÔNG BÁO -->
    <div class="notice-board" id="noticeMsg">
      Thắng tới 3600 đường!
    </div>

    <!-- THANH ĐIỀU KHIỂN DƯỚI -->
    <div class="bottom-controls">
      <!-- Số dư -->
      <div class="info-block">
        <div class="info-icon">👤</div>
        <div class="info-val">₫<span id="balance">500,000.00</span></div>
      </div>
      
      <!-- Nút Quay -->
      <div class="spin-center" onclick="spin()">
        <div class="spin-inner">
          <div class="spin-arrow">↻</div>
        </div>
      </div>

      <!-- Tiền cược -->
      <div class="info-block">
        <div class="info-icon">💰</div>
        <div class="info-val">₫<span id="bet">10,000.00</span></div>
      </div>
    </div>

    <!-- HIỆU ỨNG THẮNG LỚN -->
    <div class="win-overlay" id="winOverlay">
      <div class="win-title">THẮNG LỚN!</div>
      <div class="win-amount" id="winAmountVal">₫0.00</div>
    </div>

  </div>

  <script>
    /* =======================================================
       1. CẤU HÌNH BIỂU TƯỢNG VÀ TIỀN CƯỢC
       ======================================================= */
    const symbols = [
      { char: '👩‍🌾', cls: 'sym-W' }, 
      { char: '🔫', cls: 'sym-G' }, 
      { char: '🥃', cls: 'sym-B' }, 
      { char: '👒', cls: 'sym-H' }, 
      { char: 'A', cls: 'sym-A' },
      { char: 'K', cls: 'sym-K' },
      { char: 'Q', cls: 'sym-Q' },
      { char: 'J', cls: 'sym-J' }
    ];

    const COLS = 6;
    const ROWS = 4;
    
    // Đã nâng số tiền lên 500k và mức cược lên 10k theo yêu cầu
    let balance = 500000; 
    const bet = 10000;    

    let isSpinning = false;
    let currentMultiplier = 1;

    // Hàm format tiền tệ (thêm dấu phẩy cho hàng nghìn: 500,000.00)
    const fm = (num) => num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    /* =======================================================
       2. KHU VỰC DÀNH CHO DEV (ĐỒNG BỘ TIỀN TỪ MÁY CHỦ)
       ======================================================= */
    function syncBalance() {
      // HIỆN TẠI: Đang tự động lấy số dư từ LocalStorage của trang chủ (index.html) nếu có.
      // SAU NÀY DEV SỬA Ở ĐÂY: Thay bằng hàm lấy API từ server (Ví dụ: fetch('/api/user/balance'))
      try {
        const savedData = localStorage.getItem('qq88_saved_account');
        if (savedData) {
          const account = JSON.parse(savedData);
          if (account.balance !== undefined && account.balance > 0) {
            balance = parseFloat(account.balance);
          }
        }
      } catch (e) {
        console.log("Không tìm thấy tài khoản, dùng số dư 500k mặc định.");
      }
      updateUI(); // Cập nhật lại số tiền trên màn hình
    }


    /* =======================================================
       3. LOGIC GIAO DIỆN & QUAY HŨ
       ======================================================= */
    const grid = document.getElementById('slotGrid');
    const colsData = []; 

    function initGrid() {
      for (let c = 0; c < COLS; c++) {
        const colDiv = document.createElement('div');
        colDiv.className = 'reel-col';
        const cells = [];
        for (let r = 0; r < ROWS + 2; r++) {
          const cell = document.createElement('div');
          cell.className = 'symbol-cell';
          cell.style.top = `${(r - 1) * 25}%`; 
          setRandomSymbol(cell);
          colDiv.appendChild(cell);
          cells.push(cell);
        }
        grid.appendChild(colDiv);
        colsData.push(cells);
      }
      // Ghi số tiền cược mặc định lên UI
      document.getElementById('bet').innerText = fm(bet);
    }

    function setRandomSymbol(cell) {
      const sym = symbols[Math.floor(Math.random() * symbols.length)];
      cell.innerText = sym.char;
      cell.className = `symbol-cell ${sym.cls}`;
    }

    function updateUI() {
      document.getElementById('balance').innerText = fm(balance);
    }

    // Hàm Quay
    function spin() {
      if (isSpinning) return;
      if (balance < bet) {
        document.getElementById('noticeMsg').innerHTML = '<span style="color:#8b0000">Số dư không đủ! Nạp thêm tiền.</span>';
        return;
      }

      isSpinning = true;
      balance -= bet; 
      
      // LƯU LẠI TIỀN VÀO TRANG CHỦ (Nếu đang chơi offline)
      try {
        const savedData = localStorage.getItem('qq88_saved_account');
        if(savedData) {
          const acc = JSON.parse(savedData);
          acc.balance = balance;
          localStorage.setItem('qq88_saved_account', JSON.stringify(acc));
        }
      } catch(e) {}

      updateUI();
      document.getElementById('noticeMsg').innerText = 'Đang quay...';
      
      currentMultiplier = 1;
      updateMultiplierUI();

      let spinTime = 0;
      const spinInterval = setInterval(() => {
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS + 2; r++) {
            setRandomSymbol(colsData[c][r]);
          }
        }
        spinTime += 50;
      }, 50);

      setTimeout(() => {
        clearInterval(spinInterval);
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS + 2; r++) {
            setRandomSymbol(colsData[c][r]);
          }
        }
        checkWinLogic();
      }, 1500);
    }

    function checkWinLogic() {
      const isWin = Math.random() < 0.3; // Tỉ lệ thắng 30%

      if (isWin) {
        const mults = [2, 4, 8];
        currentMultiplier = mults[Math.floor(Math.random() * mults.length)];
        updateMultiplierUI();

        // Thắng từ x0.5 đến x5 lần tiền cược, nhân với hệ số
        const winBase = bet * (Math.random() * 4.5 + 0.5); 
        const totalWin = winBase * currentMultiplier;
        
        balance += totalWin;
        
        // LƯU LẠI TIỀN THẮNG VÀO TRANG CHỦ
        try {
          const savedData = localStorage.getItem('qq88_saved_account');
          if(savedData) {
            const acc = JSON.parse(savedData);
            acc.balance = balance;
            localStorage.setItem('qq88_saved_account', JSON.stringify(acc));
          }
        } catch(e) {}

        updateUI();
        document.getElementById('noticeMsg').innerText = `Thắng ₫${fm(totalWin)}!`;

        // Nếu thắng to (> 3 lần tiền cược) thì hiện bảng Pop-up
        if (totalWin > (bet * 3)) {
          showBigWin(totalWin);
        }
      } else {
        document.getElementById('noticeMsg').innerText = 'Thử lại vòng nữa nào!';
      }

      isSpinning = false;
    }

    function updateMultiplierUI() {
      document.getElementById('mx1').className = 'mult-item';
      document.getElementById('mx2').className = 'mult-item';
      document.getElementById('mx4').className = 'mult-item';
      document.getElementById('mx8').className = 'mult-item';
      document.getElementById('mx' + currentMultiplier).className = 'mult-item active';
    }

    function showBigWin(amount) {
      const overlay = document.getElementById('winOverlay');
      const amtText = document.getElementById('winAmountVal');
      
      amtText.innerText = `₫${fm(amount)}`;
      overlay.style.display = 'flex';
      
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 2500);
    }

    // Chạy khi web tải xong
    window.onload = () => {
      initGrid();
      syncBalance(); // Tự động đồng bộ tiền
    };
  </script>
</body>
</html>
