<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QQ88</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #004d25;
      display: flex;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .app-wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: #dce7e1;
      position: relative;
      padding-bottom: 60px;
      overflow-x: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Thanh thông báo chạy chữ */
    .marquee-bar {
      background: #ffffff;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #cbe0d3;
    }
    .marquee-content {
      overflow: hidden;
      white-space: nowrap;
      flex: 1;
      font-size: 11.5px;
      color: #004d25;
      font-weight: 600;
    }
    .marquee-inner {
      display: inline-block;
      animation: marquee 22s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* KHỐI TÀI KHOẢN VẬN HÀNH THỰC TẾ */
    .account-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 6px 8px;
      margin: 5px 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
    }

    /* Trạng thái chưa đăng nhập */
    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 36%;
    }
    .btn-login {
      background: #ffffff;
      border: 1.5px solid #005a2b;
      color: #005a2b;
      font-weight: 800;
      font-size: 12px;
      padding: 5px 0;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .btn-register {
      background: linear-gradient(180deg, #fce043 0%, #fbbe08 100%);
      border: 1px solid #dca000;
      color: #214300;
      font-weight: 800;
      font-size: 12px;
      padding: 5px 0;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      position: relative;
    }
    .tag-bonus {
      position: absolute;
      top: -6px;
      right: -3px;
      background: #e60000;
      color: #ffffff;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 8px;
      line-height: 1;
    }

    /* Trạng thái đã đăng nhập */
    .user-profile {
      width: 37%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .vip-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: #fff4d3;
      border: 1px solid #f6c042;
      color: #b26c00;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      width: fit-content;
    }
    .user-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
    }
    .user-name-text {
      font-size: 13px;
      font-weight: 800;
      color: #0b4f26;
      max-width: 85px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-balance {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 900;
      color: #2b2b2b;
    }

    /* 4 icon chức năng */
    .action-icons {
      display: flex;
      gap: 6px;
      flex: 1;
      justify-content: flex-end;
    }
    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
    }
    .action-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1.5px solid #16a34a;
      background: #f0fdf4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-box svg {
      width: 24px;
      height: 24px;
      fill: #15803d;
    }
    .action-text {
      font-size: 10px;
      font-weight: 700;
      color: #005a2b;
      margin-top: 3px;
      white-space: nowrap;
    }
    .action-badge {
      position: absolute;
      top: -5px;
      right: -3px;
      background: #ef4444;
      color: white;
      font-size: 8px;
      font-weight: 900;
      padding: 1px 3px;
      border-radius: 6px;
      line-height: 1;
    }

    /* Thanh cuộn sảnh game */
    .cat-bar {
      display: flex;
      align-items: center;
      background: #dce7e1;
      padding: 3px 2px;
    }
    .cat-scroll {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .cat-scroll img {
      width: auto;
      height: 62px;
      cursor: pointer;
    }

    /* Lưới 3 cột khít chuẩn tỉ lệ */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 6px;
    }
    .game-grid img {
      width: 100%;
      aspect-ratio: 1.48 / 1;
      object-fit: fill;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      cursor: pointer;
    }
    .game-grid img:active {
      transform: scale(0.96);
    }

    /* Bottom Navigation Bar 1 tầng */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-top: 1px solid #d4ded8;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 3px 4px 4px 4px;
      z-index: 99;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
    }
    .nav-btn {
      width: 19%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .nav-btn img {
      width: auto;
      height: 46px;
      max-width: 100%;
      object-fit: contain;
    }

    /* MODAL ĐĂNG KÝ / ĐĂNG NHẬP */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(3px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 16px;
    }
    .modal-tab-btn {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .modal-tab-btn.active {
      color: #005a2b;
      border-bottom-color: #005a2b;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
    }
    .input-field {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .input-field:focus {
      border-color: #005a2b;
    }
    .btn-submit {
      width: 100%;
      padding: 10px 0;
      background: #005a2b;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 18px;
      color: #94a3b8;
      cursor: pointer;
    }
  </style>
</head>
<body>

          <span class="action-text">Tin Tức</span>
        </div>

        <div class="action-item" onclick="handleAction('daily')">
          <span class="action-badge">60%</span>
          <div class="action-box">
            <svg viewBox="0 0 24 24"><path d="M16 6V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H2v13c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6h-6zm-6-2h4v2h-4V4zm-2 9h8v2H8v-2z"/></svg>
          </div>
          <span class="action-text">Đại Lý</span>
        </div>

        <div class="action-item" onclick="handleAction('gioithieu')">
          <span class="action-badge">+276K</span>
          <div class="action-box">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
          </div>
          <span class="action-text">Giới Thiệu</span>

    </div>

    <!-- 5. Thanh Cuộn Danh Mục Sảnh Game -->
    <div class="cat-bar">
      <img src="/images/ngoac trai.png" onerror="handleImgErr(this, ['/images/ngoac%20trai.PNG'])" onclick="navScroll(-80)" style="width: auto; height: 24px; cursor: pointer;" alt="<">
      <div id="cat-list" class="cat-scroll no-scrollbar">

        <img src="/images/hot nhat.png" onerror="handleImgErr(this, ['/images/hot%20nhat.PNG'])" onclick="filterCat('hot')" alt="Hot Nhất">

    </div>

  <!-- POPUP ĐĂNG KÝ / ĐĂNG NHẬP -->
  <div id="auth-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAuthModal()">✕</button>
      <div class="modal-tabs">
        <div id="tab-login" class="modal-tab-btn active" onclick="switchAuthTab('login')">ĐĂNG NHẬP</div>
        <div id="tab-register" class="modal-tab-btn" onclick="switchAuthTab('register')">ĐĂNG KÝ</div>
      </div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="input-group">
          <label class="input-label">Tên tài khoản</label>
          <input type="text" id="input-username" class="input-field" placeholder="Từ 4 ký tự trở lên" required autocomplete="off">
        </div>

        <div class="input-group">
          <label class="input-label">Mật khẩu</label>
          <input type="password" id="input-password" class="input-field" placeholder="Nhập mật khẩu" required>
        </div>

        <button type="submit" id="btn-modal-action" class="btn-submit">ĐĂNG NHẬP</button>
      </form>
    </div>
  </div>

  <script>
    function handleImgErr(img, fallbacks) {
      if (!img.dataset.tryCount) img.dataset.tryCount = 0;
      let count = parseInt(img.dataset.tryCount);
      if (count < fallbacks.length) {
        img.src = fallbacks[count];
        img.dataset.tryCount = count + 1;
      }
    }

    const gameList = [
      { file: "KHO BAU AZTEC.png", cat: "nohu" },
      { file: "JACKPOT DANH CA.png", cat: "banca" },
      { file: "MAT CHƯỢC THANG 4.png", cat: "nohu" },
      { file: "DUONG MAT CHƯỢC.png", cat: "nohu" },
      { file: "SIEU CAP ACE.png", cat: "nohu" },
      { file: "MIEN TAY HOANG DA.png", cat: "nohu" },
      { file: "AVIATOR.png", cat: "nohu" },
      { file: "NEKO MAY MAN.png", cat: "nohu" },
      { file: "NĂM MỚI LỘ LỘ PHAT.png", cat: "nohu" },
      { file: "THANG MAT CHƯỢC.png", cat: "nohu" },
      { file: "THỢ SAN NGOI SAO.png", cat: "banca" },
      { file: "DE QUOC HOANG KIM.png", cat: "nohu" },
      { file: "THAN CHIEN GARUDA 500.png", cat: "nohu" },
      { file: "JACKPOT VUA TAI LOC.png", cat: "banca" },
      { file: "TAI Xiu.png", cat: "gamebai" },
      { file: "QUYẾT CHIẾN TIEN THUG_.png", cat: "nohu" },
      { file: "NGỌC MAY MAN 3.png", cat: "nohu" },
      { file: "XÓC ĐĨA_.png", cat: "gamebai" },
      { file: "CHIEN THANG POKER.png", cat: "nohu" },
      { file: "DJ BOOM BOOM.png", cat: "nohu" },
      { file: "SABA THE THAO.png", cat: "thethao" },
      { file: "MAT CHƯỢC HOANG DA.png", cat: "nohu" },
      { file: "KY LAN MACH NƯỚC.png", cat: "banca" },
      { file: "JACKPOT ĐÁNH CÁ 2.png", cat: "banca" },
      { file: "THAN TAI NHAN BOI PHA_.png", cat: "nohu" },
      { file: "NGỌC MAY MAN 2.png", cat: "nohu" },
      { file: "CAO BOI HOANG DA.png", cat: "nohu" },
      { file: "BAC THAY PHI HANH GIA.png", cat: "nohu" },
      { file: "THO MAY MAN.png", cat: "nohu" },
      { file: "LÊ HỘI ĐÁ QUÝ.png", cat: "nohu" }
    ];

    function renderGames(filter = 'all') {
      const wrapper = document.getElementById('games-wrapper');
      wrapper.innerHTML = '';
      const items = (filter === 'all' || filter === 'hot') ? gameList : gameList.filter(g => g.cat === filter);

      items.forEach(g => {
        const img = document.createElement('img');
        img.src = '/images/' + encodeURIComponent(g.file);
        img.onerror = function() {
          if (!this.dataset.fallbackDone) {
            this.dataset.fallbackDone = true;
            this.src = '/images/' + g.file;
          }
        };
        img.alt = g.file;
        img.onclick = () => alert("Vào game: " + g.file.replace('.png', ''));
        wrapper.appendChild(img);
      });
    }

    function navScroll(offset) {
      document.getElementById('cat-list').scrollLeft += offset;
    }

    function filterCat(cat) {
      renderGames(cat);
    }

    /* HỆ THỐNG ĐỒNG BỘ DỮ LIỆU TỰ ĐỘNG - KHÔNG BAO GIỜ MẤT TÀI KHOẢN */
    let currentAuthMode = 'login';

    function openAuthModal(mode = 'login') {
      currentAuthMode = mode;
      document.getElementById('auth-modal').style.display = 'flex';
      switchAuthTab(mode);
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').style.display = 'none';
      document.getElementById('input-username').value = '';
      document.getElementById('input-password').value = '';
    }

    function switchAuthTab(mode) {
      currentAuthMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const btnAction = document.getElementById('btn-modal-action');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        btnAction.innerText = 'ĐĂNG NHẬP';
      } else {
        tabReg.classList.add('active');
        tabLogin.classList.remove('active');
        btnAction.innerText = 'ĐĂNG KÝ (+58K)';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('input-username').value.trim();
      const password = document.getElementById('input-password').value.trim();

      const endpoint = currentAuthMode === 'register' ? '/api/register' : '/api/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          alert(data.message);
          // Lưu vào bộ nhớ máy để không bao giờ mất
          localStorage.setItem('qq88_saved_account', JSON.stringify({
            username: data.user.username,
            password: password,
            balance: data.user.balance,
            vip: data.user.vip
          }));
          closeAuthModal();
          checkSession();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Lỗi kết nối tới máy chủ!');
      }
    }

    async function checkSession() {
      try {
        let res = await fetch('/api/me');
        let data = await res.json();

        // Tự động khôi phục dữ liệu nếu máy chủ khởi động lại
        if (!data.loggedIn) {
          const localBackup = localStorage.getItem('qq88_saved_account');
          if (localBackup) {
            const savedUser = JSON.parse(localBackup);
            const syncRes = await fetch('/api/sync-backup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user: savedUser })
            });
            const syncData = await syncRes.json();
            if (syncData.success) {
              data = { loggedIn: true, user: syncData.user };
            }
          }
        }

        const guestZone = document.getElementById('guest-zone');
        const userZone = document.getElementById('user-zone');

        if (data.loggedIn && data.user) {
          guestZone.style.display = 'none';
          userZone.style.display = 'flex';
          document.getElementById('display-username').innerText = data.user.username;
          document.getElementById('display-balance').innerText = data.user.balance;
          document.getElementById('display-vip').innerText = 'VIP' + (data.user.vip || 0);
        } else {
          guestZone.style.display = 'flex';
          userZone.style.display = 'none';
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function logoutAccount() {
      if (confirm('Bạn có muốn đăng xuất khỏi tài khoản không?')) {
        localStorage.removeItem('qq88_saved_account');
        await fetch('/api/logout', { method: 'POST' });
        checkSession();
      }
    }

    function handleAction(type) {
      alert('Mở tính năng: ' + type.toUpperCase());
    }

    window.onload = () => {
      renderGames('all');
      checkSession();
    };
  </script>
</body>
</html>
